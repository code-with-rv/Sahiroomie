name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: TypeScript type check
        run: npm run lint

      - name: Run unit tests
        run: npx tsx --test src/utils/compatibility.test.ts src/utils/seo.test.ts src/utils/pcmAudio.test.ts src/utils/mapClustering.test.ts src/utils/serverSecurity.test.ts

      - name: Build production bundle
        run: npm run build
